apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-2048
spec:
  replicas: 2
  selector:
    matchLabels:
      app: game-2048
  template:
    metadata:
      labels:
        app: game-2048
    spec:
      containers:
      - name: game-container
        image: YOUR_DOCKERHUB_USERNAME/game-2048:latest # Jenkins will push this
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: game-2048-service
spec:
  type: NodePort # Or LoadBalancer if you are on AWS/GCP
  selector:
    app: game-2048
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30007 # Access the game locally via this port

