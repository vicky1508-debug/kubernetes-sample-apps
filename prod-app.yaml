apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-grade-nginx
  labels:
    app: nginx
    tier: frontend
spec:
  replicas: 3 # Ensures high availability
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine # Using a specific, lightweight image tag
        ports:
        - containerPort: 80
        resources: # Prevents the container from consuming all node resources
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe: # Restarts the container if it crashes or freezes
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe: # Stops sending traffic if the container isn't ready
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
